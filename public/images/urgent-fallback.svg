<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="عاجل">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e31b48" />
      <stop offset="100%" stop-color="#b71c1c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="300" rx="32" fill="url(#grad)" filter="url(#shadow)" />
  <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="'Segoe UI', 'Noto Kufi Arabic', sans-serif" font-size="160" font-weight="900" letter-spacing="-6">
    عاجل
  </text>
</svg>
